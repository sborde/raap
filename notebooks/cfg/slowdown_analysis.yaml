# Paths for the data files
data:
  invivo:
    # Path to the raw data where files are grouped into subdirectories.
    raw_data:
      path: C:\Datasets\raap\InVivoJuxta\
      extension: mat
    # Path to the processed_data directory with the same structure as raw_data.
    results:
      path: C:\tmp\Bozso2025\PutRAAP\Results\NewSpikeDescriptor\InVivo
      extension: csv
      suffix:
  invitro:
    # Path to the raw data where files are grouped into subdirectories.
    raw_data:
      path: C:\Datasets\raap\InVitroJuxtaSorted\Data\mat
      extension: mat
    # Path to the processed_data directory with the same structure as raw_data.
    results:
      path: C:\tmp\Bozso2025\PutRAAP\Results\NewSpikeDescriptor\InVitro
      extension: csv
      suffix:
# Input selection: what to process from the data folders?
#  all: files in all directories with the given extension, skips the files 
#    in the skip_files list and dirs in the skip_dirs list
# mode: all
# skip_files:
#   - file1.mat
#   - file2.mat
# skip_dirs:
#   - dir1
#   - dir2
#  - all files in the directories specified in select_dirs list, without the
#    files in the skip_files list. In this case, skip_dirs ignored.
# mode: directory
# select_dirs:
#   - RSI_L2-3
#   # - dir1
#   # - dir2
# skip_files:
#   - file1.mat
#   - file2.mat
# mode: file
#  - files in any of the subdirectories from the select_files
# select_files:
#   - file1.mat
#   - file2.mat
# If you set mode to table, the input files are going to be loaded from an
# Excel table. The table must contain a column with the filenames (without extension).
# If the files are organized into subdirectories, a directory column is needed.
# Besides that, any other columns can be present and can be used for selection.
# Selection rules can be set as a logical expression. Each rule is a "dictionary",
# where the key is the column name, and the value is a list of accepted values.
# If you provide a list of rules, they are interpreted with OR logic. If you 
# dont't set any rules, all files in the table are selected.
# Example:
# mode: table
#  - table_path: <path to the Excel table>
#  select_files: list of names to select
#  skip_files: list of names to skip
input:
  dataset: invitro
  mode: table
  table_path: C:\Users\g\Downloads\data_invivo.xlsx
  select_rules:
    - noisy: 1
      raap: 1
# Output parameters
output:
  # Set True if you want to save as SVG (PNG is always saved)
  make_svg: True
  # dpi of the output png
  dpi: 100
  suffixes:
    # Suffixes of the output files' name
    # - scatter: suffix for the scatter histogram
    scatter: scatter
    # - grouped: suffix for the grouped spike averages
    category_averages: averages
    # - piechart: suffix for the spike type pie chart
    category_piechart: piechart
    # - residual_histogram: suffix for the residual histogram
    residual_histogram: residuals
    valley_time_deviation: valleys
# Analysis parameters
analysis:
  # Spike shape extractor parameters
  extractor:
    # name of the signal
    signal_name: wideband
    # name of the event marker
    event_name: spk
    # time window to cut the spikes
    cut_window: [-0.001, 0.002]
    # target sampling frequency
    fs: 40000
  # Spike description parameters
  descriptor:
    # Savitzky-Golay filter parameters, leave empty to disable
    smooth:
      window_length: 5
      polyorder: 3
    # Noise threshold above which a spike is dropped, leave empty to disable
    noise_limit:
    # Ratio of the skipped files to discard the cell
    noisiness_threshold: 0.15
    # dV threshold to detect spike start as a proportion of the max dV
    start_threshold: 0.1
    # Where to begin the description
    #  start: begin at the spike start
    #  time: begin after a given time after start proportional to the risetime
    #  amplitude: begin where the amplitude reaches the given proportion
    search_start:
      mode: 'time'
      param:
        threshold: 0.15
    # Where to end the description
    #  peak: stop at the spike peak
    #  dv_max: stop at the maximum dV
    #  time: stop with a given time before the peak proportional to the risetime
    search_end:
      mode: 'time'
      param:
        threshold: 0.15
    plot_individual: 1
  # 2D-threshold based classification group parameters. The groups must be 
  # enumerated in a list. Each group is defined by the bottom-left corner of 
  # its area. The groups must be enumerated in an increasing order, starting 
  # from the leftmost-lowest group (the default group). The first is considered
  # as the default group, which is used for the points that are not in any
  # other group, so it's no need to set its bottom-left corner.
  classification:
    groups:
      - name: 'AIS-AP'
      - name: 'UNKNOWN'
        bottom-left: [0, 0]
      - name: 'RA-AP'
        bottom-left: [0.01, 0.24]
plot:
  selector:
    scatter: True
    category_averages: True
    category_piechart: True
    residual_histogram: True
    valley_time_deviation: True
  scatter:
    # Figure size in inches
    axis_size: [5, 5]
    # Bin size for the 2D histogram-like scatter plot
    bin_size: 0.005
    # Point sizes for the scatter plot, each point is interpolated between them
    point_sizes: [10, 1000]
    axis_limits:
      x: [0.0, 0.6]
      y: [0.0, 0.8]
  category_averages:
    # Size of one Axis on the figure, the full size will be calculated
    axis_size: [5, 2.5]
    xlim: [-1, 2]
    # Plotting mode for the average shape
    #   raw: plot and average spikes as they are
    #   align: set each spike's start to 0
    #   normalize: normalize spikes start-to-peak
    mode: raw
    average:
      linewidth: 2
      alpha: 1
    superimposed:
      linewidth: 1
      alpha: 0.5
      color: "#adadad"
    # Time window for the average shape in seconds
    time_window: [-0.001, 0.002]
  category_piechart:
    # Size of the axis
    axis_size: [5, 5]
  residual_histogram:
    # Size of the axis
    axis_size: [5, 5]
    # Number of bins for the histogram
    bins: 100
    # Histogram limits
    limits: [0, 100]
    # Color of the histogram
    color: '#adadad'
  valley_time_deviation:
    # Size of the axis
    axis_size: [5, 5]
    # Number of bins for the histogram
    bins: 100
    # Histogram limits
    limits: [-1, 0]
    # Color of the histogram
    color: '#adadad'
  palette:
    PYR_L2-3: '#803300ff'
    PYR_L4-6: '#502d16ff'
    RSI_L2-3: '#ff48a3ff'
    RSI_L4-6: '#800080ff'
    FSI_L2-3: '#d54500ff'
    FSI_L4-6: '#7a0000ff'
