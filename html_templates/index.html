<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <style type="text/css">
        body {
            background-color: #f4f4f4;
        }
        h1 {
            font-size: 36px;
            color: #333;
            margin-top: 20px;
        }
        h2 {
            font-size: 24px;
            color: #333;
        }
        #container {
            background-color: #ffffff;
        }
        header {
            width: 100%;
        }
        main {
            display: flex;
            flex-direction: row;
        }
        nav {
            width: 15%;
            border-right: 2px solid black;
        }
        #cell-list {
            list-style-type: none;
            padding: 0;
        }
        #cell-list li {
            padding: 10px;
            cursor: pointer;
            color: rgb(46, 46, 223);
        }
        #cell-list li:hover {
            background-color: #e0e0e0;
        }
        #cell-list li.active {
            color: black;
            font-weight: bold;
        }
        article {
            width: 85%;
            display: flex;
            flex-direction: column
        }
        article #subtitle {
            width: 100%;
            margin-top: 20px;
        }
        article #images {
            width: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        article img {
            max-width: 100%;
            height: auto;
        }
    </style>
    <script type="text/javascript">
        // JavaScript code to dynamically populate the cell list and handle interactions
        const cells_json = `[[result_list]]`;

        let currentCellItem = null;

        function loadCell(cell) {
            let article_item = document.querySelector('article');

            while (article_item.firstChild) {
                article_item.removeChild(article_item.firstChild);
            }
            let subtitle_div = document.createElement('div');
            let images_div = document.createElement('div');
            let subtitle = document.createElement('h2');

            subtitle_div.id = 'subtitle';
            subtitle.textContent = `${cell.name} - ${cell.type}`;
            subtitle_div.appendChild(subtitle);
            article_item.appendChild(subtitle_div);
            article_item.appendChild(images_div);

            cell.images.forEach(element => {
                let image = document.createElement('img');
                image.src = element.path;
                image.alt = element.type.replace(/_/g, ' ');
                images_div.appendChild(image);
            });

        }

        document.addEventListener('DOMContentLoaded', function() {
            const cellList = document.getElementById('cell-list');
            const cells = JSON.parse(cells_json);
            cells.forEach(cell => {
                const li = document.createElement('li');
                li.textContent = `${cell.name} - ${cell.type}`;
                li.addEventListener('click', () => {

                    if (currentCellItem) {
                        currentCellItem.classList.remove('active');
                    }
                    li.classList.add('active');
                    currentCellItem = li;
                    loadCell(cell);
                });
                cellList.appendChild(li);
            });

            // Load the first cell by default
            if (cells.length > 0) {
                const firstCell = cells[0];
                const firstItem = cellList.querySelector('li');
                firstItem.classList.add('active');
                currentCellItem = firstItem;
                loadCell(firstCell);
            }
        });
    </script>
</head>
<body>
    <div id="container">
        <header>
            <h1>Result browser</h1>
        </header>
        <main>
            <nav>
                <h2>Cells</h2>
                <ul id="cell-list"></ul>
            </nav>
            <article>
            </article>
        </main>
    </div>

</body>
</html>
